name: Check index.html presence

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check-index-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify index.html exists
        run: |
          if [ ! -f "main/todo-app-main/src/frontend/index.html" ]; then
            echo "Erreur: le fichier index.html n'existe pas"
            exit 1
          else
            echo "le fichier index.html existe "
          fi
